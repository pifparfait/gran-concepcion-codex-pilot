name: Issue 7 synthetic command bridge
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: issue7-synthetic
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    environment: codex-pilot
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check exact command and avoid duplicate
        id: command
        env:
          GH_TOKEN: ${{ secrets.GC_ISSUE7_TOKEN }}
        run: |
          set -euo pipefail
          gh api --paginate 'repos/pifparfait/synthetic-population-santiago/issues/7/comments?per_page=100' > /tmp/comments.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          a=json.load(open('/tmp/comments.json'))
          ids=[c['id'] for c in a if c.get('user',{}).get('login')=='pifparfait' and c.get('body','').strip()=='GC_ISSUE7_RUN_SYNTHETIC_V1']
          if ids:
              i=max(ids)
              if not any('GC_ISSUE7_SYNTHETIC_COMPLETED:'+str(i) in c.get('body','') for c in a):
                  print('id='+str(i))
          PY
      - name: Prepare unprivileged user
        if: ${{ steps.command.outputs.id != '' }}
        run: |
          test "$(cat fixture.txt)" = "SYNTHETIC_READY"
          sudo useradd --create-home --shell /bin/bash codexpilot
          sudo chmod o+rx "$HOME" "$GITHUB_WORKSPACE"
          sudo chmod o+r fixture.txt
      - name: Run fixed synthetic Codex task
        if: ${{ steps.command.outputs.id != '' }}
        uses: openai/codex-action@bdf19a4a223ec2549a3e2274a0cf61556bc07675
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          permission-profile: ":read-only"
          codex-version: "0.138.0"
          safety-strategy: unprivileged-user
          codex-user: codexpilot
          output-file: /tmp/issue7-output.txt
          prompt: |
            Read fixture.txt. Return exactly SYNTHETIC_READY.
            Do not modify files or access external repositories.
      - name: Verify and report
        if: ${{ steps.command.outputs.id != '' }}
        env:
          GH_TOKEN: ${{ secrets.GC_ISSUE7_TOKEN }}
          COMMAND_ID: ${{ steps.command.outputs.id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          test "$(cat /tmp/issue7-output.txt)" = "SYNTHETIC_READY"
          printf 'GC_ISSUE7_SYNTHETIC_COMPLETED:%s\nPASS: SYNTHETIC_READY\nRun: %s\nSynthetic pilot only; M0 untouched.\n' "$COMMAND_ID" "$RUN_URL" > /tmp/report.txt
          gh api --method POST repos/pifparfait/synthetic-population-santiago/issues/7/comments -F body=@/tmp/report.txt
